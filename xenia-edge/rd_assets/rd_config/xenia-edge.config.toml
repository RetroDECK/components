audio_flag = 65537                                	# Audio Mode Analog.
                                                  	#  0x00000001 = Dolby Pro Logic
                                                  	#  0x00000002 = Analog Mono
                                                  	# Audio Mode Digital.
                                                  	#  0x00000000 = Digital Stereo (choose one of the above by itself)
                                                  	#  0x00010000 = Dolby Digital
                                                  	#  0x00030000 = Dolby Digital with WMA PRO
                                                  	# Special Flags.
                                                  	#  0x00000003 = Stereo Bypass
                                                  	#  0x80000000 = Low Latency
                                                  	#  This Config requires you to pair an analog and digitial flag together
                                                  	#  while digital stereo only requires an analog flag. Bonus flags are
                                                  	#  optional. Ex) 0x00010001

internal_display_resolution = 8                   	# Allow games that support different resolutions to render in a specific resolution.
                                                  	# This is not guaranteed to work with all games or improve performance.
                                                  	#    0=640x480
                                                  	#    1=640x576
                                                  	#    2=720x480
                                                  	#    3=720x576
                                                  	#    4=800x600
                                                  	#    5=848x480
                                                  	#    6=1024x768
                                                  	#    7=1152x864
                                                  	#    8=1280x720 (Default)
                                                  	#    9=1280x768
                                                  	#    10=1280x960
                                                  	#    11=1280x1024
                                                  	#    12=1360x768
                                                  	#    13=1440x900
                                                  	#    14=1680x1050
                                                  	#    15=1920x540
                                                  	#    16=1920x1080
                                                  	#    17=internal_display_resolution_x/y

use_50Hz_mode = false                             	# Enables usage of PAL-50 mode.
user_country = 103                                	# User country ID.
                                                  	#    1=AE   2=AL   3=AM   4=AR   5=AT   6=AU   7=AZ   8=BE   9=BG
                                                  	#   10=BH  11=BN  12=BO  13=BR  14=BY  15=BZ  16=CA  18=CH  19=CL
